services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nombresmad
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nombresmad"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: nombresmad
      ADMIN_USER: ${ADMIN_USER:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD?Set_ADMIN_PASSWORD_in_.env_or_empty_to_disable}
      ADMIN_SECRET: ${ADMIN_SECRET?Set_ADMIN_SECRET_in_.env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID?Set_GOOGLE_CLIENT_ID_in_.env}
      NOMAD_JSON: /app/seed_data/initial_load.json
    ports:
      - 8080:8080
    volumes:
      - ./backend:/app
      - ./backend/seed_data/initial_load.json:/app/seed_data/initial_load.json:ro

  frontend:
    build:
      context: ./frontend
      target: deps
      args:
        REACT_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID?Set_GOOGLE_CLIENT_ID_in_.env}
    environment:
      API_PROXY_TARGET: http://backend:8080
      WATCHPACK_POLLING: "true"
      REACT_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID?Set_GOOGLE_CLIENT_ID_in_.env}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - 3000:3000
    depends_on:
      - backend
    command: ["npm", "start"]

volumes:
  db_data:
